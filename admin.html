<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budgeter - Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/dark-theme.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">

    <script type="module" src="js/firebase-init.js"></script>
</head>
<body>
    <div id="login-screen" class="login-screen hidden">
        <div class="login-card">
            <h1>Acesso negado</h1>
            <p class="login-subtitle">Faça login no app principal primeiro.</p>
            <a class="btn btn-primary btn-full" href="/">Ir para o app</a>
        </div>
    </div>

    <div id="app" class="app hidden">
        <header class="header">
            <div class="header-left">
                <a class="btn btn-ghost btn-icon" href="/" title="Voltar">
                    <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 14l-5-5 5-5"/></svg>
                </a>
                <div class="logo">
                    <svg width="28" height="28" viewBox="0 0 40 40"><rect width="40" height="40" rx="8" fill="#3b82f6"/><path d="M12 20C12 15.5817 15.5817 12 20 12V12C24.4183 12 28 15.5817 28 20V28H20C15.5817 28 12 24.4183 12 20V20Z" fill="white"/></svg>
                    <span>Admin</span>
                </div>
            </div>
            <div class="header-right">
                <span id="user-email" class="muted small"></span>
                <button id="btn-logout" class="btn btn-ghost btn-icon" title="Sair">
                    <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14L4 9m0 0l5-5M4 9h11"/></svg>
                </button>
            </div>
        </header>

        <div class="app-body admin-body">
            <aside class="sidebar admin-sidebar">
                <nav class="admin-nav">
                    <button class="admin-nav-item active" data-tab="usuarios">👤 Usuários</button>
                    <button class="admin-nav-item" data-tab="perfis">🎫 Perfis & Permissões</button>
                    <button class="admin-nav-item" data-tab="filiais">🏢 Filiais</button>
                    <button class="admin-nav-item" data-tab="ccs">📁 Centros de Custo</button>
                    <button class="admin-nav-item" data-tab="classes">🏷 Classes de Custo</button>
                    <button class="admin-nav-item" data-tab="landing">📥 Importar Landing</button>
                    <button class="admin-nav-item" data-tab="historico">🕘 Histórico de Landings</button>
                    <button class="admin-nav-item" data-tab="volume">📊 Volume (Budget/Landing)</button>
                </nav>
            </aside>

            <main class="main-content admin-main">
                <div id="tab-content"></div>
            </main>
        </div>
    </div>

    <div id="modal-root"></div>

    <script type="module" src="js/formatters.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/database.js"></script>
    <script type="module" src="js/admin/admin.js"></script>
</body>
</html>
